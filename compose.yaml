name: crease
services:
  crease:
    image: crease:local
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${CREASE_BIND:-127.0.0.1}:${CREASE_PORT:-2222}:2222"
    volumes:
      - crease-data:/var/lib/crease
      - type: bind
        source: ${CREASE_OWNER_KEY:-./deploy/local/owner.pub}
        target: /etc/crease/owner.pub
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  crease-data:
